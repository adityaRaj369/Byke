name: Backend CI/CD

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:

  # ─── Stage 1: Build ───────────────────────────────────────────────────────
  build:
    name: 1. Build (Compile)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.5'

      - name: Build with Gradle (skip tests)
        working-directory: ./backend
        run: gradle build -x test --no-daemon

      - name: Upload JAR artifact
        uses: actions/upload-artifact@v4
        with:
          name: backend-jar
          path: backend/build/libs/*.jar
          retention-days: 1

  # ─── Stage 2: Dockerize ───────────────────────────────────────────────────
  dockerize:
    name: 2. Dockerize (Build & Push Image)
    runs-on: ubuntu-latest
    needs: [build]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download JAR artifact
        uses: actions/download-artifact@v4
        with:
          name: backend-jar
          path: backend/build/libs/

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/byke-backend:latest
          cache-from: type=registry,ref=${{ secrets.DOCKER_USERNAME }}/byke-backend:buildcache
          cache-to: type=registry,ref=${{ secrets.DOCKER_USERNAME }}/byke-backend:buildcache,mode=max

  # ─── Stage 3: Deploy ──────────────────────────────────────────────────────
  deploy:
    name: 3. Deploy (EC2 Production)
    runs-on: ubuntu-latest
    needs: [build]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download JAR artifact
        uses: actions/download-artifact@v4
        with:
          name: backend-jar
          path: ./backend-jar/

      - name: Deploy JAR to EC2
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          source: "backend-jar/byke-backend-1.0.0.jar"
          target: "/tmp/"
          strip_components: 1

      - name: Start backend on EC2
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            set -e
            
            # Stop old backend process
            pkill -f "byke-backend" || true
            sleep 2
            
            # Start new backend
            nohup java -jar /tmp/byke-backend-1.0.0.jar > /tmp/byke-backend.log 2>&1 &
            
            # Wait for backend to start
            sleep 5
            
            # Check if process is running
            if pgrep -f "byke-backend" > /dev/null; then
              echo "✓ Backend started successfully"
              sleep 2
              curl -s http://localhost:8080/api/health || echo "Health check endpoint pending..."
            else
              echo "✗ Backend failed to start"
              cat /tmp/byke-backend.log
              exit 1
            fi
