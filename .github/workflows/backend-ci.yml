name: Backend CI/CD

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:

  # ─── Stage 1: Build ───────────────────────────────────────────────────────
  build:
    name: 1. Build (Compile & Test)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Generate Gradle Wrapper
        working-directory: ./backend
        run: gradle wrapper

      - name: Build with Gradle (skip tests)
        working-directory: ./backend
        run: ./gradlew build -x test --no-daemon

      - name: Upload JAR artifact
        uses: actions/upload-artifact@v4
        with:
          name: backend-jar
          path: backend/build/libs/*.jar
          retention-days: 1

  # ─── Stage 2: Dockerize ───────────────────────────────────────────────────
  dockerize:
    name: 2. Dockerize (Build & Push Image)
    runs-on: ubuntu-latest
    needs: [build]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download JAR artifact
        uses: actions/download-artifact@v4
        with:
          name: backend-jar
          path: backend/build/libs/

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/byke-backend:latest
          cache-from: type=registry,ref=${{ secrets.DOCKER_USERNAME }}/byke-backend:buildcache
          cache-to: type=registry,ref=${{ secrets.DOCKER_USERNAME }}/byke-backend:buildcache,mode=max

  # ─── Stage 3: Deploy ──────────────────────────────────────────────────────
  deploy:
    name: 3. Deploy (EC2 Production)
    runs-on: ubuntu-latest
    needs: [dockerize]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - name: Deploy to server
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.PRODUCTION_HOST }}
          username: ${{ secrets.PRODUCTION_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            mkdir -p /opt/byke
            cd /opt/byke

            # Write the .env file from GitHub Secret
            echo "${{ secrets.PRODUCTION_ENV_FILE }}" > .env

            # Write the Firebase service account JSON from GitHub Secret
            echo '${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}' > firebase-service-account.json

            # Pull the latest backend image from Docker Hub
            docker-compose pull backend

            # Restart all services
            docker-compose up -d

            # Clean up old images to save disk space
            docker system prune -f
