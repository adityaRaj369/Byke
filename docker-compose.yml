services:
  postgres:
    image: postgres:15-alpine
    container_name: byke-postgres
    environment:
      POSTGRES_DB: byke
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - byke-network

  redis:
    image: redis:7-alpine
    container_name: byke-redis
    ports:
      - "6379:6379"
    networks:
      - byke-network

  kafka:
    image: confluentinc/cp-kafka:7.5.0
    container_name: byke-kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
    depends_on:
      - zookeeper
    networks:
      - byke-network

  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    container_name: byke-zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    ports:
      - "2181:2181"
    networks:
      - byke-network

  backend:
    image: ${DOCKER_USERNAME}/byke-backend:latest
    container_name: byke-backend
    ports:
      - "8080:8080"
    env_file:
      - .env
    depends_on:
      - postgres
      - redis
      - kafka
    networks:
      - byke-network

volumes:
  postgres_data:

networks:
  byke-network:
    driver: bridge
